name: Deploy Personal Page to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload site to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          source: "index.html,styles.css,assets"
          target: "/tmp/personal_page_landing_build"
          rm: true

      - name: Activate site on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            mkdir -p /var/www/personal_page
            rm -rf /var/www/personal_page/*
            cp -r /tmp/personal_page_landing_build/* /var/www/personal_page/
            sudo nginx -t && sudo systemctl reload nginx || true